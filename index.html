<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMG Details EstetiCar | Estética Automotiva</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #050b14;
      --bg-card: #091322;
      --neon-blue: #0088ff;
      --neon-cyan: #00d9ff;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --border-blue: rgba(0, 136, 255, 0.3);
      --shadow-glow: 0 0 15px rgba(0, 136, 255, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      overflow-x: hidden;
      line-height: 1.6;
    }

    header {
      background: rgba(5, 11, 20, 0.95);
      backdrop-filter: blur(12px);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      border-bottom: 1px solid var(--border-blue);
      padding: 12px 24px;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--neon-cyan);
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-gothic {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--text-white);
      letter-spacing: 1px;
    }

    .brand-subtext {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--neon-cyan);
      letter-spacing: 2px;
    }

    .header-contact {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-contact-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-white);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
    }

    .header-contact-item i {
      color: var(--neon-cyan);
    }

    /* Hero Section Corrigida */
    .hero {
      padding: 180px 20px 100px;
      position: relative;
      background: linear-gradient(90deg, rgba(5, 11, 20, 0.95) 0%, rgba(5, 11, 20, 0.75) 50%, rgba(5, 11, 20, 0.4) 100%),
                  url('fundo.png') center right/cover no-repeat;
      min-height: 80vh;
      display: flex;
      align-items: center;
    }

    .hero-content {
      max-width: 600px;
      margin-left: max(20px, calc((100vw - 1200px) / 2));
      z-index: 2;
      background: rgba(9, 19, 34, 0.85);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border-blue);
      backdrop-filter: blur(8px);
    }

    .hero-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 4px;
      background: rgba(0, 136, 255, 0.15);
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .hero h1 span.blue-text {
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 25px;
      font-weight: 500;
    }

    .hero-buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn-main {
      background: var(--neon-blue);
      color: #fff;
      padding: 12px 28px;
      border-radius: 6px;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-glow);
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .btn-main:hover {
      background: #0077ee;
      transform: translateY(-2px);
    }

    .btn-outline {
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 12px 28px;
      border-radius: 6px;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      background: rgba(0, 217, 255, 0.05);
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .btn-outline:hover {
      background: rgba(0, 217, 255, 0.2);
    }

    @media (max-width: 768px) {
      .header-contact { display: none; }
      .hero { padding-top: 130px; background-position: center; }
      .hero-content { margin: 0 10px; padding: 20px; }
      .hero h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="brand-logo">
        <img src="logo.png" alt="CMG Details EstetiCar">
        <div class="brand-title">
          <span class="brand-gothic">CMG DETAILS</span>
          <span class="brand-subtext">ESTÉTICA AUTOMOTIVA PREMIUM</span>
        </div>
      </a>
      <div class="header-contact">
        <a href="https://wa.me/5571991430784" target="_blank" class="header-contact-item">
          <i class="fa-brands fa-whatsapp"></i> 71 9 9143 0784
        </a>
        <a href="https://www.instagram.com/cmg_details_esteticar" target="_blank" class="header-contact-item">
          <i class="fa-brands fa-instagram"></i> @cmg_details_esteticar
        </a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <div class="hero-badge">CUIDADO, PROTEÇÃO E VALORIZAÇÃO</div>
      <h1>CMG <br><span class="blue-text">Details EstetiCar</span></h1>
      <p>Mais que uma lavagem, é cuidado agregado à proteção. Tratamento técnico detalhado para renovar e valorizar o seu veículo.</p>
      <div class="hero-buttons">
        <a href="#calculadora" class="btn-main"><i class="fa-solid fa-calculator"></i> Simular Orçamento</a>
        <a href="https://wa.me/5571991430784" target="_blank" class="btn-outline"><i class="fa-brands fa-whatsapp"></i> Falar Conosco</a>
      </div>
    </div>
  </section>

</body>
</html>
